[project]
name = "needrail"
version = "0.1.0"
description = "Get what you NEED to succeed & do agentic public good"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NeedRail Contributors" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
needrail = "needrail.server:main"
needrail-mcp = "needrail.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
