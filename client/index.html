<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content="#0E1116"><title>NeedRail</title>
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF6A2B'/%3E%3Cpath d='M9 23V9h3.4l6.2 9.1V9H22v14h-3.4l-6.2-9.1V23z' fill='%230E1116'/%3E%3C/svg%3E">
</head><body style="margin:0;background:#0E1116;color:#EAF0F6;font:15px system-ui;min-height:100dvh;display:grid;place-items:center">
<p id=s>Loading NeedRail…</p>
<script>
(async()=>{
const b64="PLACEHOLDER_SEE_APP_FULL";
const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
if(!window.DecompressionStream){document.getElementById("s").textContent="Use Chrome/Firefox/Safari 16.4+";return;}
const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
document.open();document.write(html);document.close();
})().catch(e=>document.getElementById("s").textContent=String(e));
</script>
<p style="position:fixed;bottom:12px;font-size:12px;opacity:.5">If this stays blank, open <a href="app.full.html" style="color:#62A8FF">app.full.html</a> instead.</p>
</body></html>
